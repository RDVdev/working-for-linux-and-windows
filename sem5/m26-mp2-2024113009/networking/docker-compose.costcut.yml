# Cost-cutting scenario overlay: simulate the institute banning TCP on the
# LAN while the players run mastermind with --cost-cutting (UDP transfer).
#
#   docker compose -f docker-compose.yml -f docker-compose.costcut.yml up -d --build
#
# BLOCK_TCP=1 makes the entrypoint reject every TCP packet in both
# directions (needs NET_ADMIN); UDP discovery keeps working. REJECT is used
# instead of DROP so connect() fails immediately instead of hanging ~130s.

x-blocked: &blocked
  cap_add:
    - NET_ADMIN
  environment:
    BLOCK_TCP: "1"
    MASTERMIND_FLAGS: "--log --cost-cutting"

services:
  player1:
    <<: *blocked
  player2:
    <<: *blocked
  player3:
    <<: *blocked
  player4:
    <<: *blocked
