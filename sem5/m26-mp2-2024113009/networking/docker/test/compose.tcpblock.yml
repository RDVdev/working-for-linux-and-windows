# Negative-test overlay: block TCP inside the containers but run WITHOUT
# --cost-cutting. A challenge must then fail to connect, which proves that
# BLOCK_TCP really cuts TCP.
#
#   docker compose -f docker-compose.yml -f docker/test/compose.test.yml \
#                  -f docker/test/compose.tcpblock.yml up -d player1 player2

x-blocked-tcp: &blocked-tcp
  cap_add:
    - NET_ADMIN
  environment:
    BLOCK_TCP: "1"

services:
  player1:
    <<: *blocked-tcp
  player2:
    <<: *blocked-tcp
